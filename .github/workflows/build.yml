name: Build ImmortalWrt RE-SS-01

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'ImmortalWrt branch/tag/commit'
        required: false
        default: 'master'
        type: string
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'config/re-ss-01.config'
      - 'scripts/add-factory-image.sh'

permissions:
  contents: write

concurrency:
  group: re-ss-01-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
      SOURCE_REF: ${{ inputs.source_ref || 'master' }}

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions timeout:2 attempts:3\n' | sudo tee /etc/resolv.conf >/dev/null
          getent hosts archive.ubuntu.com || true
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --fix-missing --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-packaging \
            rsync unzip zlib1g-dev file wget curl subversion swig time xsltproc \
            zstd ccache libelf-dev libdw-dev libbpf-dev device-tree-compiler

      - name: Clone official ImmortalWrt
        run: |
          git clone --depth=1 --branch "$SOURCE_REF" "$SOURCE_REPO" immortalwrt || {
            git clone "$SOURCE_REPO" immortalwrt
            cd immortalwrt
            git checkout "$SOURCE_REF"
          }
          cd immortalwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          git log -1 --oneline

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add RE-SS-01 factory image rule
        working-directory: immortalwrt
        run: |
          bash "$GITHUB_WORKSPACE/scripts/add-factory-image.sh"

      - name: Configure only RE-SS-01
        working-directory: immortalwrt
        run: |
          cp "$GITHUB_WORKSPACE/config/re-ss-01.config" .config
          make defconfig
          echo '===== selected target ====='
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq60xx|qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01)=' .config
          echo '===== device package ====='
          grep -E '^CONFIG_PACKAGE_ipq-wifi-jdcloud_re-ss-01=' .config || true

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j"$(nproc)"
          find dl -type f -size -1024c -delete

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify RE-SS-01 images
        id: images
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FACTORY < <(find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*jdcloud_re-ss-01*factory.bin' | sort)
          mapfile -t SYSUPGRADE < <(find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*jdcloud_re-ss-01*sysupgrade.bin' | sort)

          if [ "${#FACTORY[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one RE-SS-01 factory.bin, got ${#FACTORY[@]}"
            find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          if [ "${#SYSUPGRADE[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one RE-SS-01 sysupgrade.bin, got ${#SYSUPGRADE[@]}"
            find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "${FACTORY[0]}" "$GITHUB_WORKSPACE/output/"
          cp "${SYSUPGRADE[0]}" "$GITHUB_WORKSPACE/output/"

          MANIFEST=$(find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f -name '*jdcloud_re-ss-01*.manifest' | head -n1 || true)
          [ -n "$MANIFEST" ] && cp "$MANIFEST" "$GITHUB_WORKSPACE/output/"

          (
            cd "$GITHUB_WORKSPACE/output"
            sha256sum * > sha256sums
            ls -lh
            cat sha256sums
          )

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-RE-SS-01-${{ env.SOURCE_COMMIT }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: re-ss-01-${{ env.SOURCE_COMMIT }}
          name: ImmortalWrt RE-SS-01 ${{ env.SOURCE_COMMIT }}
          body: |
            Source: immortalwrt/immortalwrt
            Ref: ${{ env.SOURCE_REF }}
            Commit: ${{ env.SOURCE_COMMIT }}

            Device: JDCloud RE-SS-01
            Target: qualcommax/ipq60xx

            Includes:
            - factory.bin
            - sysupgrade.bin
            - sha256sums
          files: output/*
